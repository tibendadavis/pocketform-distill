# Form spec template: a fictional two-section intake and tally sheet.
# Copy this folder to forms/<your-form>/ and edit. Coordinates are pixels in the template image (or the drawn page).
name: _template
kind: sectioned            # layout family. Only "sectioned" exists today: a stack of titled sections of fields
description: Fictional paper intake and tally sheet
version: "1.0"

# Blank photo/scan of the form next to this file (only template.png is committed). null = draw a blank from this
# spec (page, printed items, markers, labels and boxes), so the form works with no image assets at all.
# With a real image, get each field's box with: uv run python scripts/pick_boxes.py forms/<form>/template.png
template_image: null
page: [1000, 700]          # width, height of the drawn blank

markers:                   # solid alignment squares (fiducials) in three corners, [x, y, w, h]
  - [55, 55, 28, 28]
  - [917, 55, 28, 28]
  - [55, 617, 28, 28]

printed:                   # printed ink that is not a field: one of text / rect / line per item
  - {rect: [40, 40, 920, 620], color: [190, 190, 190]}
  - {text: "Fictional intake & tally sheet", at: [100, 70], size: 22, bold: true}
  - {text: "DEMO-1  v1.0", at: [900, 70], anchor: rm, size: 13, color: [130, 130, 130]}

sections:
  - id: visit
    title: A  Visit
    printed:
      - {rect: [80, 112, 840, 32], fill: [228, 228, 228], width: 0}
      - {text: "A  Visit", at: [96, 128], size: 18, bold: true}
      - {text: "morning / afternoon / evening", at: [470, 295], size: 14, color: [120, 120, 120]}
    fields:
      # box: [x, y, w, h]. type: text | integer | date | choice
      - id: site_name
        label: Site
        type: text
        box: [230, 165, 400, 40]
        values: [North Clinic, River Post, Hill Camp, East Market, Lake Station]  # optional; random words if absent
      - id: visit_date
        label: Date
        type: date
        box: [230, 220, 220, 40]
        min: 2024-01-01        # optional date range for synthetic values
        max: 2026-12-31
        format: "%d/%m/%Y"     # how people write it; truth is always ISO (YYYY-MM-DD)
      - id: shift
        label: Shift
        type: choice
        box: [230, 275, 220, 40]
        options: [morning, afternoon, evening]

  - id: tally
    title: B  Tally
    printed:
      - {rect: [80, 345, 840, 32], fill: [228, 228, 228], width: 0}
      - {text: "B  Tally", at: [96, 361], size: 18, bold: true}
    fields:
      - id: arrivals_count
        label: Arrivals
        type: integer
        box: [230, 395, 105, 40]
        digits: 3              # printed digit cells ("comb" box); one handwritten digit per cell
        min: 0
        max: 500
      - id: departures_count
        label: Departures
        type: integer
        box: [230, 450, 105, 40]
        digits: 3
        min: 0
        max: 500
