[project]
name = "pocketform-distill"
version = "0.1.0"
description = "Distill a large vision-language model into a small on-device model that reads one paper form layout."
readme = "README.md"
authors = [
    { name = "Davis" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["knowledge-distillation", "vision-language-model", "ocr", "forms", "on-device", "ollama", "transformers"]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.16.0",
    "datasets>=5.2.0",
    "mlflow>=3.18.0",
    "ollama>=0.6.3",
    "peft>=0.22.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "transformers>=5.24.0",
    "trl>=1.18.2",
    "typer>=0.29.2",
]

[project.scripts]
pocketform-distill = "pocketform_distill:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pyyaml>=6.0.4",
    "ruff>=0.17.6",
]
